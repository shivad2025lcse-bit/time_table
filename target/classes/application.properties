spring.application.name=smart-timetable-scheduler
server.port=8095

# ── Gemini AI (for AI Quiz Generator) ──────────────────────────────────────
# Add your Gemini API key here to enable real AI-generated quiz questions.
# Get one free at: https://aistudio.google.com/app/apikey
gemini.api.key=${GEMINI_API_KEY:}

# Embedded H2 Database (Configured in MySQL Compatibility Mode for trial)
spring.datasource.url=jdbc:h2:file:./data/smart_timetable;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable default sql initialization so JPA auto-creates tables first
spring.sql.init.mode=never

# Enable H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# College Timezone & Async Email / Brevo / SMTP Settings
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.email.provider=${EMAIL_PROVIDER:AUTO}
app.email.from-address=${EMAIL_FROM:noreply@smarttimetable.edu}
app.email.from-name=${EMAIL_FROM_NAME:College Timetable Management System}
app.email.brevo.api-key=${BREVO_API_KEY:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=SmartTimetableSecretKeyForJWTAuthSuperSecureTokenLength32CharsOrMore
jwt.expiration=86400000

# File Upload Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
logging.level.org.springframework.web=DEBUG
spring.devtools.restart.enabled=false
