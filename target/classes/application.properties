spring.application.name=smart-timetable-scheduler
server.port=8081

# Embedded H2 Database (Configured in MySQL Compatibility Mode for trial)
spring.datasource.url=jdbc:h2:file:./data/smart_timetable;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable default sql initialization so JPA auto-creates tables first
spring.sql.init.mode=never

# Enable H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration
jwt.secret=SmartTimetableSecretKeyForJWTAuthSuperSecureTokenLength32CharsOrMore
jwt.expiration=86400000

# File Upload Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.port=8081
